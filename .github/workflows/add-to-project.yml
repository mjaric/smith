name: Add implementation issues to Smith board

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    if: github.event.label.name == 'impl'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          PROJECT_ID: PVT_kwHOAAT9884Bf1hn
          STATUS_FIELD_ID: PVTSSF_lAHOAAT9884Bf1hnzhaFhXM
          STATUS_BACKLOG: bedc5e5a
          SLICE_FIELD_ID: PVTSSF_lAHOAAT9884Bf1hnzhaFhnw
          SLICE_OPTIONS: >-
            {"slice-0":"02064a06","slice-1":"c11a11dc","slice-2":"48657387",
            "slice-3":"17579018","slice-4":"0504c46a","slice-5":"14c239c7",
            "slice-6":"90cad943"}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const issueNodeId = context.payload.issue.node_id;

            const add = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }`, { projectId, contentId: issueNodeId });
            const itemId = add.addProjectV2ItemById.item.id;

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId,
                  fieldId: $fieldId, value: $value
                }) { projectV2Item { id } }
              }`, {
                projectId, itemId,
                fieldId: process.env.STATUS_FIELD_ID,
                value: { singleSelectOptionId: process.env.STATUS_BACKLOG }
              });

            const sliceOptions = JSON.parse(process.env.SLICE_OPTIONS);
            const sliceLabel = context.payload.issue.labels
              .map(l => l.name).find(n => sliceOptions[n]);
            if (sliceLabel) {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId,
                    fieldId: $fieldId, value: $value
                  }) { projectV2Item { id } }
                }`, {
                  projectId, itemId,
                  fieldId: process.env.SLICE_FIELD_ID,
                  value: { singleSelectOptionId: sliceOptions[sliceLabel] }
                });
            }
